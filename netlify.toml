[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# tarusstills.com is the primary domain for this site.
# www.tarusstills.com redirects to that apex.
# stillianoblack.com remains a legacy alias of tdstills.com.
# No path-level [[redirects]] here that would conflict with Next.js routes.

[[redirects]]
  from = "https://stillianoblack.com/*"
  to = "https://tdstills.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.stillianoblack.com/*"
  to = "https://tdstills.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tarusstills.com/*"
  to = "https://tarusstills.com/:splat"
  status = 301
  force = true